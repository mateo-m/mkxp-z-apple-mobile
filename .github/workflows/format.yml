name: Format

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: format-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # rubocop checks the style and the lint cops in one run. The
  # annotations show each offense on the diff.
  ruby:
    name: Ruby (rubocop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: rubocop
        run: |
          if ! bundle exec rubocop --format github; then
            echo "::error::rubocop found offenses. Run \`bundle exec rubocop --autocorrect-all\` locally, fix what it cannot fix, and commit."
            exit 1
          fi

  # Aggregate gate whose check-run name matches the ruleset's required
  # "Format" context exactly.
  summary:
    name: Format
    needs: [ruby]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job that no runner takes ends as "abandoned", which is
      # neither failure nor cancelled, so ask for success.
      - name: Verify every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -c 'map_values(.result)' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
