# Builds the engine and its dependencies for the iOS device, the iOS
# simulator and the Mac, and publishes mkxp-z-ios.tar.gz when a tag v*
# is pushed.
# A run from the Actions tab builds the same file and keeps it as a
# workflow artifact.
#
# The release notes give the sha256, which a host pins next to the tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The SDKs share the source trees, so each one builds in its own job.
  build:
    name: Build ${{ matrix.sdk }}
    runs-on: macos-latest
    timeout-minutes: 300
    strategy:
      matrix:
        sdk: [iphoneos, iphonesimulator, macosx]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Select the newest Xcode
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Install the build tools
        run: brew install automake autoconf libtool pkg-config bison

      - name: Check for launcher code
        run: tools/check-no-host-code.sh

      - name: Build
        run: |
          tools/build-deps-ios.sh "${{ matrix.sdk }}"
          (cd deps && make -f "${{ matrix.sdk }}.make" mkxp-merged mkxp-core)

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.sdk }}-arm64
          path: |
            deps/build-${{ matrix.sdk }}-arm64/lib
            deps/build-${{ matrix.sdk }}-arm64/ruby-stdlib
            deps/build-${{ matrix.sdk }}-arm64/licenses.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Package and publish
    needs: build
    # tools/package-ios.sh checks each library with otool and nm.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Each artifact goes into deps/<artifact name>, the folder that
      # tools/package-ios.sh reads.
      - uses: actions/download-artifact@v6
        with:
          pattern: build-*-arm64
          path: deps

      - name: Package
        id: package
        run: |
          set -eu
          tools/package-ios.sh --tag "$GITHUB_REF_NAME"
          SHA256="$(shasum -a 256 mkxp-z-ios.tar.gz | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          # shellcheck disable=SC2016 # markdown backticks, not a command
          printf 'Built from `%s`.\n\nsha256: `%s`\n' "$GITHUB_SHA" "$SHA256" > notes.md
          gh release create "$GITHUB_REF_NAME" mkxp-z-ios.tar.gz --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Keep the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: mkxp-z-ios
          path: mkxp-z-ios.tar.gz
