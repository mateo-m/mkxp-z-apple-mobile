name: Lint

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  ruby:
    name: Ruby (rubocop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # bundler-cache reads Gemfile.lock and caches gem installs
          # across runs. Saves ~15s after first run.
          bundler-cache: true

      - name: rubocop
        run: bundle exec rubocop --format github

  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install markdownlint-cli
        run: npm ci

      - name: markdownlint
        run: |
          # Drive markdownlint from git ls-files but exclude
          # vendored upstream READMEs (theoraplay/, etc.) that we
          # don't own and don't want to reformat.
          FILES=$(git ls-files '*.md' \
            ':!:src/theoraplay/' \
            ':!:hmode7/')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs npx markdownlint -c .markdownlint.json
          fi
