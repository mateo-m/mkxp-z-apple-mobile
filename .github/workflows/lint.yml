name: Lint

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# rubocop runs in the Format workflow.
jobs:
  ruby:
    name: Ruby (regression tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"

      # The compat scripts patch classes that only exist inside a
      # running game, so these tests stub the engine bindings and the
      # Pokemon Essentials classes. No simulator or GPU needed.
      - name: regression tests
        run: |
          for test in tools/test_*.rb; do
            echo "-> $test"
            ruby "$test"
          done

  cpp:
    name: C++ (host tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These build the engine sources under test directly. No SDL,
      # no GPU, no Ruby, and no launcher, so a plain runner is enough.
      - name: host tests
        run: tools/run-cpp-tests.sh

  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install markdownlint-cli
        run: bun install --frozen-lockfile

      - name: markdownlint
        run: |
          # Drive markdownlint from git ls-files but exclude
          # vendored upstream READMEs (theoraplay/, etc.) that we
          # don't own and don't want to reformat.
          FILES=$(git ls-files '*.md' \
            ':!:src/theoraplay/' \
            ':!:hmode7/')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bun x markdownlint -c .markdownlint.json
          fi

  host-code:
    name: No launcher code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only hmode7. The dependency sources under deps/sources are
      # upstream code and hold no launcher names.
      - name: Checkout hmode7
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: \
              submodule update --init --depth 1 hmode7

      - name: check
        run: tools/check-no-host-code.sh

  # Aggregate gate whose check-run name matches the ruleset's required
  # "Lint" context exactly.
  summary:
    name: Lint
    needs: [ruby, cpp, markdown, host-code]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job that no runner takes reaches this job with a result that
      # is neither failure nor cancelled, so ask for success.
      - name: Verify every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -c 'map_values(.result)' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
