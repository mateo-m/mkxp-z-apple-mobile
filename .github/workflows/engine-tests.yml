name: Engine tests

# The in-engine suite needs a running engine: a simulator, a GPU, and
# a Ruby VM. That rules out the ubuntu runner the other checks use.
# This workflow builds the engine, links the test host in tests/host,
# and reads the results back off the simulator.
#
# It also runs the host Ruby tests a second time. Two of them
# (test_save_fs, test_save_fs_case) simulate a case-sensitive device
# on a case-folding host, so they skip themselves on ubuntu. macOS
# folds case, so MKXP_TESTS_NO_SKIP turns a skip here into a failure.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to build on
        type: choice
        options: [hosted, self]
        default: hosted

concurrency:
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job that `if:` skips still reports, and the summary job counts a
  # skip as a pass. A workflow that `paths-ignore` skips never reports,
  # so the required check would wait forever.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An empty list, also from a failed call, runs the tests.
          FILES="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')" || FILES=""
          printf 'changed files:\n%s\n' "$FILES"
          if [ -n "$FILES" ] && ! printf '%s\n' "$FILES" | grep -qv '\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  simulator:
    name: Engine tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self') && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    timeout-minutes: 120
    steps:
      # The core build compiles hmode7. The dependency sources are
      # needed only when the dependency cache misses. The submodule
      # URLs use SSH, and the runner has no SSH key.
      - uses: actions/checkout@v6

      - name: Check out hmode7
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1 hmode7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Select newest Xcode
        # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
        # step works on a hosted runner and on a self-hosted Mac.
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      # Most of this job is the two builds, and a push changes a few
      # sources at a time. ccache turns the rest into a hit. The two
      # build scripts pick it up on their own. It also helps inside
      # one job: the binding loop has no up-to-date check, so the
      # second build compiles all three Ruby versions again.
      - name: Set up ccache
        run: |
          command -v ccache >/dev/null || brew install ccache
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            # This job picks the newest Xcode above. The default
            # compiler check reads size and mtime, so a runner image
            # that ships a new clang could serve objects the old one
            # built. Hashing the compiler removes the doubt.
            echo "CCACHE_COMPILERCHECK=content"
            # The cache travels to and from the runner on every job.
            echo "CCACHE_MAXSIZE=800M"
          } >> "$GITHUB_ENV"

      # Restore on every run, but save only on a push to dev. A cache
      # a pull request writes is scoped to that pull request, so no
      # other run can read it. Saving one per push would fill the
      # 10 GB the repository gets and evict the cache dev wrote.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-engine-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-engine-tests-${{ runner.os }}-

      # The host Ruby tests need no engine, so run them before the
      # long build. A break here fails the job in seconds.
      - name: Host Ruby tests, with no skips allowed
        env:
          MKXP_TESTS_NO_SKIP: "1"
        run: |
          for test in tools/test_*.rb; do
            echo "-> $test"
            ruby "$test"
          done

      # A dependency build takes most of an hour. The key changes only
      # when a recipe, a patch, a source file of ours, a pinned source,
      # or Xcode changes.
      - name: Key the dependency cache
        id: deps-key
        run: |
          {
            git ls-tree HEAD deps/sources
            xcodebuild -version
          } | shasum -a 256 | cut -d' ' -f1 | sed 's/^/sources=/' >> "$GITHUB_OUTPUT"

      - name: Restore the dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/build-iphonesimulator-arm64
            deps/ANGLE
          key: deps-iphonesimulator-${{ steps.deps-key.outputs.sources }}-${{ hashFiles('deps/*.make', 'deps/*.sh', 'deps/*.lst', 'deps/*/*.patch', 'deps/*/*.rb', 'deps/*/*.c', 'deps/*/*.S', 'tools/build-deps-ios.sh') }}

      - name: Build the dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1 deps/sources
          brew install automake autoconf libtool pkg-config bison
          tools/build-deps-ios.sh iphonesimulator

      # This step builds the host. The steps after it pick their suite
      # and their interpreter at launch, so they reuse the build.
      - name: Run the in-engine suite
        run: tools/run-engine-tests.sh --timeout 300

      # Once per interpreter: the engine ships three, and a game
      # that runs on one has to run on the others.
      - name: Run the interpreter suite
        run: |
          for v in 18 19 31; do
            tools/run-engine-tests.sh --suite ruby_compat.rb --ruby "$v" \
              --no-build --timeout 300
          done

      # The win32 text stand-ins load only on Ruby 1.9 and later.
      - name: Run the win32 text conversion suite
        run: |
          for v in 19 31; do
            tools/run-engine-tests.sh --suite win32_wrap_encoding.rb --ruby "$v" \
              --no-build --timeout 300
          done

      - name: Run the file lookup order suite
        run: |
          tools/run-engine-tests.sh --suite file_lookup_order.rb \
            --no-build --timeout 300

      # The other side of the legacy-method check: with the transform
      # off, no script can call a legacy method, so the engine must
      # not define one. A game reads Module#method_defined? and
      # installs its own copy.
      - name: Run the legacy-method suite with the transform off
        run: |
          tools/run-engine-tests.sh --suite legacy_methods_off.rb --ruby 31 \
            --no-build --timeout 300

      # The last two suites each need a game folder of their own, and
      # so a build of their own. The legacy-method support only runs
      # for scripts that come out of Scripts.rxdata. See tests/README.md.
      - name: Run the legacy-method suite
        run: |
          ruby tests/legacy-methods/pack_scripts.rb
          tools/run-engine-tests.sh --game tests/legacy-methods --timeout 300

      # Once per interpreter: the engine splits the Data/Scripts loader
      # with the Ruby that the game runs on.
      - name: Run the script-folder suite
        run: |
          ruby tests/script-folder/pack_scripts.rb
          tools/run-engine-tests.sh --game tests/script-folder --timeout 300
          for v in 18 19; do
            tools/run-engine-tests.sh --game tests/script-folder --ruby "$v" \
              --no-build --timeout 300
          done

      - name: Report the cache hit rate
        if: always()
        run: ccache -s || true

      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-engine-tests-${{ runner.os }}-${{ github.sha }}

  # Aggregate gate, so the ruleset has one context to require.
  summary:
    name: Engine tests summary
    needs: [changes, simulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
