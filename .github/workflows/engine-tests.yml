name: Engine tests

# The in-engine suite needs a running engine: a simulator, a GPU, and
# a Ruby VM. That rules out the ubuntu runner the other checks use.
# This workflow builds the engine, links the test host in tests/host,
# and reads the results back off the simulator.
#
# It also runs the host Ruby tests a second time. Two of them
# (test_save_fs, test_save_fs_case) simulate a case-sensitive device
# on a case-folding host, so they skip themselves on ubuntu. macOS
# folds case, so MKXP_TESTS_NO_SKIP turns a skip here into a failure.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to build on
        type: choice
        options: [hosted, self]
        default: hosted

concurrency:
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Engine tests
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self') && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          # hmode7 is a submodule and the core build compiles it.
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Select newest Xcode
        # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
        # step works on a hosted runner and on a self-hosted Mac.
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      # Most of this job is the two builds, and a push changes a few
      # of the 54 core sources at a time. ccache turns the rest into
      # a hit. tools/build-core-ios.sh picks it up on its own.
      - name: Set up ccache
        run: |
          command -v ccache >/dev/null || brew install ccache
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            # This job picks the newest Xcode above. The default
            # compiler check reads size and mtime, so a runner image
            # that ships a new clang could serve objects the old one
            # built. Hashing the compiler removes the doubt.
            echo "CCACHE_COMPILERCHECK=content"
            # The cache travels to and from the runner on every job.
            echo "CCACHE_MAXSIZE=800M"
          } >> "$GITHUB_ENV"

      # Restore on every run, but save only on a push to dev. A cache
      # a pull request writes is scoped to that pull request, so no
      # other run can read it. Saving one per push would fill the
      # 10 GB the repository gets and evict the cache dev wrote.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-engine-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-engine-tests-${{ runner.os }}-

      # The host Ruby tests need no engine, so run them before the
      # long build. A break here fails the job in seconds.
      - name: Host Ruby tests, with no skips allowed
        env:
          MKXP_TESTS_NO_SKIP: "1"
        run: |
          for test in tools/test_*.rb; do
            echo "-> $test"
            ruby "$test"
          done

      # No cache here on purpose. The tarballs hold both SDKs, so a
      # cache that stored one of them would miss every time, and
      # restoring both costs more than the download.
      - name: Fetch the dependencies
        run: tools/fetch-deps-ios.sh --sdk iphonesimulator

      # This step builds the host. The two after it pick their suite
      # and their interpreter at launch, so they reuse the build.
      - name: Run the in-engine suite
        run: tools/run-engine-tests.sh --timeout 300

      # Once per interpreter: the engine ships three, and a game
      # that runs on one has to run on the others.
      - name: Run the interpreter suite
        run: |
          for v in 18 19 31; do
            tools/run-engine-tests.sh --suite ruby_compat.rb --ruby "$v" \
              --no-build --timeout 300
          done

      # The other side of the legacy-method check: with the transform
      # off, no script can call a legacy method, so the engine must
      # not define one. A game reads Module#method_defined? and
      # installs its own copy.
      - name: Run the legacy-method suite with the transform off
        run: |
          tools/run-engine-tests.sh --suite legacy_methods_off.rb --ruby 31 \
            --no-build --timeout 300

      # Last, because it needs a second game folder and so a second
      # build. The legacy-method support only runs for scripts that
      # come out of Scripts.rxdata. See tests/README.md.
      - name: Run the legacy-method suite
        run: |
          ruby tests/legacy-methods/pack_scripts.rb
          tools/run-engine-tests.sh --game tests/legacy-methods --timeout 300

      - name: Report the cache hit rate
        if: always()
        run: ccache -s || true

      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-engine-tests-${{ runner.os }}-${{ github.sha }}

  # Aggregate gate, so the ruleset has one context to require.
  summary:
    name: Engine tests summary
    needs: [simulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
