name: Engine tests

# The in-engine suites need a running engine: a simulator, a GPU, and
# a Ruby VM. That rules out the ubuntu runner the other checks use.
# This workflow builds the engine, links the test host in tests/host,
# and reads the results back off the simulator. It also builds the
# engine for the iOS device and the Mac, as the release does.
#
# It also runs the host Ruby tests a second time. Two of them
# (test_save_fs, test_save_fs_case) simulate a case-sensitive device
# on a case-folding host, so they skip themselves on ubuntu. macOS
# folds case, so MKXP_TESTS_NO_SKIP turns a skip here into a failure.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

# A new push to a pull request replaces its old run. Each push to dev
# gets its own run, because the release reads the result of each one.
concurrency:
  group: engine-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  simulator:
    name: Engine tests
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      fingerprint: ${{ steps.pass.outputs.fingerprint }}
      test: ${{ steps.pass.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/xcode

      # A run that passes uploads a marker named after a hash of every
      # file except Markdown, the Xcode version and the macOS version.
      # A pull request that finds a marker of its own hash does not
      # test again, and dev only fills the caches.
      #
      # A fork's run can upload a marker of any name, and an older
      # version of this workflow uploaded markers for runs that did not
      # pass. So only a v2 marker counts, and only from a run of this
      # workflow in this repository that ended in success. A failed
      # lookup runs the tests.
      #
      # TEST runs the suites. BUILD builds the test host, which a push
      # to dev always does to fill the caches.
      - name: Look for a pass of the same files
        id: pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          FINGERPRINT="$({
            git ls-files -s -- ':!:*.md'
            xcodebuild -version
            sw_vers
          } | shasum -a 256 | cut -d' ' -f1)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          PASS=""
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=engine-tests-passed-v2-$FINGERPRINT&per_page=100" \
              --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $REPO_ID) | .workflow_run.id] | unique | .[]")" || RUNS=""
            for RUN in $RUNS; do
              PASS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" \
                --jq 'select(.conclusion == "success" and .path == ".github/workflows/engine-tests.yml" and .head_repository.id == .repository.id) | .html_url')" || PASS=""
              [ -n "$PASS" ] && break
            done
          fi
          TEST=true
          if [ -n "$PASS" ]; then
            echo "::notice::These files passed in $PASS, so this run does not test them again."
            TEST=false
          fi
          BUILD="$TEST"
          [ "$GITHUB_EVENT_NAME" = push ] && BUILD=true
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          printf 'TEST=%s\nBUILD=%s\n' "$TEST" "$BUILD" >> "$GITHUB_ENV"

      # The binding build compiles hmode7. The submodule URLs use SSH,
      # and the runner has no SSH key.
      - name: Check out hmode7
        if: env.BUILD == 'true'
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1 hmode7

      - uses: ./.github/actions/ccache
        if: env.BUILD == 'true'
        with:
          name: engine-tests-iphonesimulator

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        if: env.BUILD == 'true'
        with:
          ruby-version: "3.4"

      # The host Ruby tests need no engine, so run them before the
      # long build. A break here fails the job in seconds.
      - name: Host Ruby tests, with no skips allowed
        if: env.TEST == 'true'
        env:
          MKXP_TESTS_NO_SKIP: "1"
        run: |
          for test in tools/test_*.rb; do
            echo "-> $test"
            ruby "$test"
          done

      # Also when the tests skip, so that the run of a pull request
      # head holds the artifact that dev takes after the merge.
      - uses: ./.github/actions/deps
        with:
          sdk: iphonesimulator

      # One build holds all three game folders. The steps below pick
      # the game, the suites and the interpreter at launch.
      - name: Build the test host
        id: host
        if: env.BUILD == 'true'
        run: |
          ruby tests/legacy-methods/pack_scripts.rb
          ruby tests/script-folder/pack_scripts.rb
          tools/build-test-host-ios.sh \
            --game tests/engine --game tests/legacy-methods --game tests/script-folder

      - name: Report the cache hit rate
        if: env.BUILD == 'true'
        run: ccache -s

      # A cache that a pull request saves serves only that pull
      # request, so only dev saves.
      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-engine-tests-iphonesimulator-${{ github.sha }}

      # Each launch runs its suites one after the other, and each
      # suite reports on its own. The suite steps run also when an
      # earlier one fails, so one run shows every failure.
      #
      # fast_forward_clock.rb goes first, because it measures the
      # frame rate of a fresh engine.
      - name: Suites on the default Ruby
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          tools/run-engine-tests.sh --no-build --timeout 300 \
            --suite fast_forward_clock.rb --suite mega_bitmap.rb --suite file_lookup_order.rb \
            --suite midi_playback.rb

      - name: File lookup suite without the path cache
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          tools/run-engine-tests.sh --no-build --timeout 300 \
            --suite file_lookup_order.rb --config '{"pathCache":false}'

      - name: Fast-forward suite at four times the speed
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          tools/run-engine-tests.sh --no-build --timeout 300 \
            --suite fast_forward_clock.rb --fast-forward 4

      # legacy_methods_off.rb goes first, because the other suites
      # load code that it must not see. The win32 text stand-ins load
      # only on Ruby 1.9 and later.
      - name: Suites on Ruby 3.1
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          tools/run-engine-tests.sh --no-build --timeout 300 --ruby 31 \
            --suite legacy_methods_off.rb --suite ruby_compat.rb --suite win32_wrap_encoding.rb

      - name: Suites on Ruby 1.9
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          tools/run-engine-tests.sh --no-build --timeout 300 --ruby 19 \
            --suite ruby_compat.rb --suite win32_wrap_encoding.rb

      - name: Suites on Ruby 1.8
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          tools/run-engine-tests.sh --no-build --timeout 300 --ruby 18 \
            --suite ruby_compat.rb

      # The legacy-method support only runs for scripts that come out
      # of Scripts.rxdata, so this suite needs a game folder of its
      # own. See tests/README.md.
      - name: Legacy-method suite
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: tools/run-engine-tests.sh --no-build --timeout 300 --game tests/legacy-methods

      # Once per interpreter: the engine splits the Data/Scripts loader
      # with the Ruby that the game runs on.
      - name: Script-folder suite
        if: env.TEST == 'true' && !cancelled() && steps.host.outcome == 'success'
        run: |
          STATUS=0
          for ruby in default 18 19; do
            set -- --no-build --timeout 300 --game tests/script-folder
            [ "$ruby" = default ] || set -- "$@" --ruby "$ruby"
            tools/run-engine-tests.sh "$@" || STATUS=1
          done
          exit "$STATUS"

  # The release builds these two. A break here shows before a tag.
  engine:
    name: Engine for ${{ matrix.sdk }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, macosx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out hmode7
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1 hmode7

      - uses: ./.github/actions/xcode

      # On dev this also fills the cache that the release reads.
      - uses: ./.github/actions/deps
        with:
          sdk: ${{ matrix.sdk }}

      - name: Build the engine
        run: tools/build-engine-ios.sh --sdk "${{ matrix.sdk }}"

      # They link the static FluidSynth of the Mac dependencies.
      - name: MIDI tests
        if: matrix.sdk == 'macosx'
        run: tools/run-midi-tests.sh

  # One check for the whole run. The ruleset does not require it. It
  # writes the pass marker that a later run looks for.
  summary:
    name: Engine tests summary
    needs: [simulator, engine]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job that no runner takes ends as "abandoned", which is
      # neither failure nor cancelled, so ask for success. The
      # pass marker below depends on this step.
      - name: Verify every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -c 'map_values(.result)' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null

      - name: Write the pass marker
        if: needs.simulator.outputs.test == 'true'
        run: echo "${{ needs.simulator.outputs.fingerprint }}" > "$RUNNER_TEMP/fingerprint"

      - name: Upload the pass marker
        if: needs.simulator.outputs.test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-tests-passed-v2-${{ needs.simulator.outputs.fingerprint }}
          path: ${{ runner.temp }}/fingerprint
          retention-days: 90
